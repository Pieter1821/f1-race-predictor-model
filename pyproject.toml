[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1pred"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Deprecations triggered by our own code fail the tests; ones inside third-party libraries don't
filterwarnings = [
    "error::DeprecationWarning:f1pred",
    "error::FutureWarning:f1pred",
]
